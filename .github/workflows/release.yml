name: Release Binaries

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

# Binary GitHub Releases stay opt-in. Leave ENABLE_PRODUCTION_PUBLISH unset on this fork.
jobs:
  frontend:
    if: ${{ vars.ENABLE_PRODUCTION_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-web
          path: internal/web/dist
          if-no-files-found: error

  build:
    if: ${{ vars.ENABLE_PRODUCTION_PUBLISH == 'true' }}
    needs: frontend
    name: ${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: '7' }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: embedded-web
          path: internal/web/dist
      - name: Build binary and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ inputs.tag || github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILT_AT: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ext=""
          arch="$GOARCH"
          if [ -n "${GOARM:-}" ]; then arch="${GOARCH}v${GOARM}"; fi
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="cdt-monitor_${VERSION}_${GOOS}_${arch}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.builtAt=github-run-${BUILT_AT}" \
            -o "release/${name}${ext}" ./cmd/cdt-monitor
          if [ "$GOOS" = "windows" ]; then
            (cd release && zip "${name}.zip" "${name}${ext}")
          else
            tar -C release -czf "release/${name}.tar.gz" "${name}${ext}"
          fi
          rm "release/${name}${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.goarm || 'default' }}
          path: release/*
          if-no-files-found: error

  publish:
    if: ${{ vars.ENABLE_PRODUCTION_PUBLISH == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/*
