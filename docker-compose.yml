# Local-only Compose for the 86669666/CDT-Monitor fork.
# Tags ghcr.io/86669666/cdt-monitor:local after a local build.
# Do not run `docker compose push` or otherwise publish this tag.
name: cdt-monitor

services:
  cdt-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
        COMMIT: unknown
        BUILT_AT: local
        IMAGE_SOURCE: https://github.com/86669666/CDT-Monitor
    image: ghcr.io/86669666/cdt-monitor:local
    pull_policy: build
    container_name: cdt-monitor
    restart: on-failure:3
    init: true
    stop_grace_period: 15s
    stop_signal: SIGTERM
    security_opt:
      - no-new-privileges:true
    privileged: false
    cap_drop:
      - ALL
    user: "65532:65532"
    pids_limit: 256
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:43210:8080"
    environment:
      CDT_DATA_DIR: /data
      CDT_LISTEN: :8080
      CDT_WORKERS: 2
      TZ: Asia/Taipei
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    volumes:
      - cdt-data:/data
    healthcheck:
      test: ["CMD", "/cdt-monitor", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cdt-data:
