      },
      "SetupInput": {
        "type": "object",
        "properties": {
          "admin_password": {
            "type": "string",
            "writeOnly": true,
            "description": "Sensitive input. Omitted from responses; never place real values in examples or logs. Required at setup (at least 10 UTF-8 bytes; at most 128 Unicode characters); empty on config save preserves the existing password.",
            "maxLength": 128
          },
          "traffic_threshold": {
            "type": "integer",
            "description": "0 or omitted defaults to 95; otherwise 1..100."
          },
          "enable_schedule_notification": {
            "type": "boolean"
          },
          "shutdown_mode": {
            "type": "string",
            "description": "Empty defaults to KeepCharging; accepted KeepCharging or StopCharging."
          },
          "threshold_action": {
            "type": "string",
            "description": "Empty defaults to stop_and_notify; accepted stop_and_notify or notify_only."
          },
          "keep_alive": {
            "type": "boolean"
          },
          "api_interval": {
            "type": "integer",
            "description": "Seconds. 0 or omitted defaults to 600; otherwise 30..86400."
          },
          "enable_billing": {
            "type": "boolean"
          },
          "timezone": {
            "type": "string",
            "description": "IANA timezone; empty defaults to Asia/Shanghai, at most 64 characters."
          },
          "enable_daily_report": {
            "type": "boolean"
          },
          "daily_report_time": {
            "type": "string",
            "description": "Empty defaults to 22:00. Current save path does not validate this global clock; subsequent reads can reject it."
          },
          "notifications": {
            "$ref": "#/components/schemas/NotificationConfigInput",
            "description": "Full replacement of non-sensitive notification settings. Empty secret fields preserve saved values; __clear__ clears supported notification secrets."
          },
          "accounts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AccountInput"
            },
            "description": "Full replacement of active accounts, maximum 32. Omitting/empty removes all active accounts (soft delete). IDs match existing records; id=0 can match AccessKey/region/instance composite.",
            "maxItems": 32
          }
        },
        "additionalProperties": false,
        "description": "Initial configuration. admin_password is required and must contain at least 10 UTF-8 bytes, at most 128 Unicode characters. Other fields have the same defaults as configuration save; account schedule clocks are store-validated without PUT normalization.",
        "required": [
          "admin_password"
        ]
      },
      "DiscoveredInstance": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "instance_id",
