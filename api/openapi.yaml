    "securitySchemes": {
      "Session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "cdt_session",
        "description": "Administrator session. Login/setup/passkey login creates a 24-hour exclusive session and invalidates earlier sessions. HttpOnly, SameSite=Strict, Path=/; Secure on HTTPS (including trusted proxy HTTPS)."
      },
      "CSRFCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "cdt_csrf",
        "description": "Session-bound CSRF token, readable by JavaScript, SameSite=Strict, Path=/, lifetime 24h. Required together with CSRFHeader for session mutations."
      },
      "CSRFHeader": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CDT-CSRF",
        "description": "Must match the session-derived token and cdt_csrf cookie; header/cookie/session lengths <=128 bytes."
      },
      "BearerKey": {
        "type": "http",
        "scheme": "bearer",
        "description": "Opaque API Key (not JWT), with required operation scope. Nonempty presented Bearer takes precedence over X-API-Key and session; invalid key does not fall back to a valid session."
      },
      "HeaderKey": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key",
        "description": "Alternative to Bearer; opaque API Key with required operation scope. API Key authentication bypasses CSRF."
