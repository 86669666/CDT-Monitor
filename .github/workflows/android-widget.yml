name: Android Widget

# Manual-only prototype build. Keystore secrets are optional GitHub secrets.
# Do not assume a local JDK/SDK/Gradle toolchain; this workflow is the
# supported package path for the 86669666 fork.

on:
  workflow_dispatch:

concurrency:
  group: android-widget-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android widget packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-widget
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        run: |
          # Accept licenses non-interactively so this job cannot hang
          # the 20m timeout waiting on a prompt.
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-home-cache-cleanup: true

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cdt-widget.jks"
            chmod 600 "$RUNNER_TEMP/cdt-widget.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/cdt-widget.jks" >> "$GITHUB_ENV"
          fi

      - name: Build installable APKs and release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.1
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Android packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cdt-monitor-widget-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            android-widget/app/build/outputs/apk/debug/*.apk
            android-widget/app/build/outputs/apk/release/*.apk
            android-widget/app/build/outputs/bundle/release/*.aab

      - name: Remove decoded keystore
        if: always()
        run: |
          keystore="${ANDROID_KEYSTORE_FILE:-$RUNNER_TEMP/cdt-widget.jks}"
          if [ -f "$keystore" ]; then
            shred -u "$keystore" 2>/dev/null || rm -f "$keystore"
          fi
          rm -f "$RUNNER_TEMP/cdt-widget.jks"
