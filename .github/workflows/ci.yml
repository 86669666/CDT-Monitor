name: CI

# Verify only: frontend build, Go test/vet, linux/amd64 binary.
# No GHCR/Docker Hub/GitHub Release. Manual dispatch is for when
# GitHub has registered workflows on this fork; it still does not publish.

on:
  pull_request:
  push:
    branches: [dev, main, 'work/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - name: Verify Go
        run: go test -race ./... && go vet ./...
      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' ./cmd/cdt-monitor
