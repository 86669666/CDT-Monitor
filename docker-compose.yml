# Local-only Compose for the 86669666/CDT-Monitor fork.
# Tags ghcr.io/86669666/cdt-monitor:local after a local build.
# Do not run `docker compose push` or otherwise publish this tag.
name: cdt-monitor

services:
  cdt-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
        COMMIT: unknown
        BUILT_AT: local
        IMAGE_SOURCE: https://github.com/86669666/CDT-Monitor
    image: ghcr.io/86669666/cdt-monitor:local
    pull_policy: build
    container_name: cdt-monitor
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "43210:8080"
    environment:
      CDT_DATA_DIR: /data
      CDT_LISTEN: :8080
      CDT_WORKERS: 4
      TZ: Asia/Taipei
    volumes:
      - cdt-data:/data
    healthcheck:
      test: ["CMD", "/cdt-monitor", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cdt-data:
