              "subscription",
              "spot",
              "pay_as_you_go",
              "unknown"
            ]
          }
        }
      },
      "DiscoveryPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "instances",
          "next_token"
        ],
        "properties": {
          "instances": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/DiscoveredInstance"
            }
          },
          "next_token": {
            "type": "string",
            "maxLength": 2048
          }
        }
      },
      "DiscoverInstancesRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "access_key_id",
          "region_id"
        ],
        "properties": {
          "source_account_id": {
            "type": "integer",
            "minimum": 0,
            "default": 0
          },
          "access_key_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "access_key_secret": {
            "type": "string",
            "maxLength": 128,
            "writeOnly": true
          },
          "region_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 32
          },
          "next_token": {
            "type": "string",
            "maxLength": 2048
          }
        },
        "description": "Use source_account_id > 0 plus exact expected access_key_id with empty/absent secret, or source_account_id=0 plus new key and secret. Saved credential identity is matched atomically. Query is read-only and never persists credentials or adds instances."
      }
    }
  }
