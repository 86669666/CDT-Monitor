name: Automatic Release

# This fork does not auto-run on main push. Keep workflow_dispatch only.
# Jobs still require ENABLE_PRODUCTION_PUBLISH. Do not restore tag/dev/main
# push triggers without an explicit publish authorization.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v2.0.0'
        required: true
        type: string

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

# Default token cannot write contents. Tagging and GitHub Releases elevate
# only on those jobs, and they still require ENABLE_PRODUCTION_PUBLISH=true.
# packages: write stays omitted so this fork cannot push GHCR.
permissions:
  contents: read

# Publishing stays opt-in on this fork. Leave ENABLE_PRODUCTION_PUBLISH unset.
jobs:
  tag:
    if: ${{ vars.ENABLE_PRODUCTION_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Version is an explicit dispatch input. Do not clone full history
          # just to list tags. persist-credentials stays on for git push tag.
          fetch-depth: 1
          persist-credentials: true
      - name: Calculate version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.version }}
    # Do not inherit repo secrets. GITHUB_TOKEN is enough for GitHub
    # Releases; Docker Hub credentials must not reach reusable workflows.

  container:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      version: ${{ needs.tag.outputs.version }}
      ref: ${{ needs.tag.outputs.version }}
