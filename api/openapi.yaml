          "authenticatorAttachment": {
            "type": "string"
          },
          "clientExtensionResults": {
            "type": "object",
            "additionalProperties": true
          },
          "response": {
            "type": "object",
            "properties": {
              "clientDataJSON": {
                "type": "string"
              },
              "attestationObject": {
                "type": "string"
              },
              "transports": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              }
            },
            "additionalProperties": true,
            "required": [
              "clientDataJSON",
              "attestationObject"
            ]
          }
        },
        "additionalProperties": true,
        "required": [
          "id",
          "rawId",
          "type",
          "response"
        ],
        "description": "WebAuthn browser credential; binary fields serialized as base64url. Protocol-library validation applies; this is not decoded by the strict config JSON decoder."
