{
  "openapi": "3.1.0",
  "info": {
    "title": "CDT Monitor implemented HTTP API",
    "version": "0.1.0",
    "description": "Implementation-derived contract at baseline 81fed54472db3b70a09a8fcc399baadc70aaa147. JSON syntax is used deliberately (a YAML 1.2 subset) so Go standard-library tests can read this .yaml without a product dependency. Covers explicit API, health and legacy registrations; static assets excluded. Go GET routes also serve HEAD with the same authentication and status, without a response body. No CORS/OPTIONS API is registered. Normal responses use application/json; charset=utf-8. Strict JSON handlers reject unknown fields and use a 1 MiB reader; not all handlers read the body. Authentication alternatives and CSRF requirements are operation-specific. API Key scopes are described by x-api-key-scopes (not OAuth). Runtime dates are RFC3339; unset Go time values may be year 0001. Global panic recovery returns Error/internal_error with 500. Unknown /api/* paths return JSON 404; unsupported methods on these paths can hit the same static fallback (no general 405 guarantee).",
    "x-source-files": [
      "internal/httpapi/server.go",
      "internal/domain/models.go",
      "internal/store/config.go",
      "internal/store/auth.go",
      "internal/store/runtime.go",
      "internal/engine/engine.go",
      "web/src/api.ts",
      "web/src/App.tsx",
      "android-widget/app/src/main/java/com/wang4386/cdtmonitor/widget/CdtApi.java"
    ]
  },
