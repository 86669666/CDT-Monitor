name: cdt-lan-navigation
services:
  navigation:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    pull_policy: never
    container_name: cdt-lan-navigation
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /data:size=16m,mode=0700
      - /config:size=16m,mode=0700
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro
      - ./tls:/certs:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, http://10.10.99.99/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
