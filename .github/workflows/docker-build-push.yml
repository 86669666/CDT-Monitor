name: Container Images

# This fork never publishes. Dispatch / auto-release workflow_call only
# load-verify a linux/amd64 image. No registry login, no GHCR/Hub names,
# no QEMU/arm64, no push. Do not add those back without publish authorization.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      ref:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify linux/amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          # No type=gha cache. This fork never wrote one, and GHA cache
          # is not a substitute for a registry.
          tags: cdt-monitor:verify-amd64
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILT_AT=github-run-${{ github.run_id }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}

      - name: Check linux/amd64 binary architecture
        run: docker run --rm cdt-monitor:verify-amd64 version | grep -q 'linux/amd64)'
