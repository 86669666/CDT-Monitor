      "LoginCredential": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "rawId": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "public-key"
            ]
          },
          "authenticatorAttachment": {
            "type": "string"
          },
          "clientExtensionResults": {
            "type": "object",
            "additionalProperties": true
          },
          "response": {
            "type": "object",
            "properties": {
              "clientDataJSON": {
                "type": "string"
              },
