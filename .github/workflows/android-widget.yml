name: Android Widget

# Manual-only prototype build. Keystore secrets are optional GitHub secrets.
# Do not assume a local JDK/SDK/Gradle toolchain; this workflow is the
# supported package path for the 86669666 fork.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android widget packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cdt-widget.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/cdt-widget.jks" >> "$GITHUB_ENV"
          fi

      - name: Build installable APKs and release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.1
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: cdt-monitor-widget-${{ github.sha }}
          if-no-files-found: error
          path: |
            android-widget/app/build/outputs/apk/debug/*.apk
            android-widget/app/build/outputs/apk/release/*.apk
            android-widget/app/build/outputs/bundle/release/*.aab
