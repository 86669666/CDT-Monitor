name: Publish Guard

# Cheap tripwire for this fork. Does not publish, log in, or push.
# Fails if production publish vars are set, if workflow YAML
# regains GHCR/Hub login, packages: write, secrets: inherit, or
# registry image names, or if Compose drops 127.0.0.1:43210.
# Do not add pull_request_target, workflow_run, or repository_dispatch.
# Keep GitHub-hosted ubuntu-latest; do not add self-hosted runners.
# Do not set continue-on-error or dump toJSON(secrets).
# Do not add issue_comment, schedule, discussion, or watch triggers.
# Do not add job services: sidecars or type=gha/registry build cache.
# Do not add GitHub Environment jobs (production, staging, or otherwise).
# Workflow secrets.* allowlist is the optional Android keystore names only.
# Do not add actions/github-script.
# Do not add gh release create, actions/create-release, or npm publish.
# Do not add QEMU or docker-container Buildx.
# Do not add deployments/pages/statuses/checks write permissions.
# upload-artifact stays on widget CI and gated Release Binaries only.
# download-artifact stays on gated Release Binaries only.
# Do not add standalone actions/cache; setup-go/setup-node caches stay.
# Do not add GitHub Pages deploy actions.
# Buildx/build-push-action stays on Container Images verify only.
# action-gh-release stays on gated Release Binaries only.
# Android/Gradle actions stay on widget CI only.
# setup-go/setup-node stay on CI verify and gated Release Binaries only.
# CI verify still skips these files so a login regression would
# not run Go tests; this workflow covers that.

on:
  pull_request:
  push:
    branches: [dev, main, 'work/**']
  workflow_dispatch:

concurrency:
  group: publish-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assert-no-publish:
    name: Assert no publish surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Assert fork publish surfaces stay closed
        env:
          ENABLE_PRODUCTION_PUBLISH: ${{ vars.ENABLE_PRODUCTION_PUBLISH }}
          ENABLE_DOCKERHUB_PUBLISH: ${{ vars.ENABLE_DOCKERHUB_PUBLISH }}
        run: bash .github/scripts/assert-no-publish.sh
